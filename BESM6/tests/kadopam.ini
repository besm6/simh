; КАДОПАМ regression test.
;
; Runs a small program that selects КРК channel 2, reads the channel status
; in cell 0, writes and reads back Э-60 memory, reads cell 77777 through an
; index register, checks that channel 1 has its own memory and that a read
; clears the right half of the accumulator.  Success is
; the loop at address 1017 (octal); a failure loops at 1040-1044.

set dks enabled
load kadopam.b6
br 1017
br 1040
br 1041
br 1042
br 1043
br 1044

go -q 1000
if (PC != 01017) echof "FAIL: kadopam, stopped at"; ex PC; exit 1
if ((PRP & 040) != 0) echof "FAIL: kadopam, ПРП 6 raised by a read"; exit 1
nobr 1017
nobr 1040
nobr 1041
nobr 1042
nobr 1043
nobr 1044
set dks disabled

echof "PASS: kadopam"
