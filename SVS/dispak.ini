#
# Запуск операционной системы Диспак на симуляторе СВС.
#
#   svs dispak.ini
#

# Перенаправляем вывод консоли в файл.
! rm -f dispak.trace
set console log=dispak.trace

# Включаем трассировку машинных команд (без полного дампа регистров и памяти:
# полная трассировка "set cpu0 trace" на длинном прогоне разрастается до гигабайтов).
set cpu0 itrace

# Загружаем модуль АДАП в память.
load adap.b6

# Подключаем системный диск к каналу 0, устройству 0 (DISK0).
attach DISK0 /home/leob/git/besm6.github.io/download/disks/svs2053.bin

# Задаём конфигурацию: один процессор и один ПВВ.
d RKP 1040000000000000

# Слово пульта 2: номер канала для МД (разряды 22:21) и МБ (разряды 20:19).
# Без него АДАП останавливается по СТОП 40114 "НЕ ЗАДАН КАНАЛ ДЛЯ МД".
d 2 5000000

# Параметр НАПРУС: направление и номер устройства системного диска.
# 0 = канал 0, устройство 0 (соответствует attach DISK0 выше).
d 30115 0

# --- Конфигурация таблиц устройств АДАП (в норме это делает Диспак: СВТЛУ + ТУС/ТУСЗ).
# АТЛУ[НСВС=0] := база ТЛУ[СВС0] (СВТЛУ: АТЛУ[i]=ТЛУ+i*КТИПОВ). Без этого поиск НУС
# в ТЛУ пропускается и заявка уходит по ветви ОТДАЮЗ (НУС=0).
d 31603 31411
# ТЛУ[СВС0][МД]: НОУ=0 (логич. устр. 0), КОУ=4, база НУС в ТУС = 0120, ССЫЛ=0.
d 31411 400120
# ТУСЗ[НУС=0120] (адрес ТУСЗ_база 30200 + 0120 = 30320): тип ёмкости 1 (29 МБ, разр.28),
# канал 0 (разр.33:38=0). Делает устройство «определённым» и задаёт зону «как есть».
d 30320 1000000000

# Приписка стека, разряды 10:8 номеров физ.страниц.
d 7 7777000000000000
#d 7 0017000000000000

# Точка входа ВЫЗОС: вызов операционной системы.
d M7 30000
br 33543
go 30036
e ACC
e rmr
nobr 33543
step 2000000

quit
