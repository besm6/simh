# ppmprint.ini — печать задачи на ЕС-7934 (терминал 2) вместо АЦПУ1.
#
#   ln -sf ppmprint.ini scenario.ini && PPM=2 ./boot.sh
#
# Условия (АЦД.md, «ЕС-7934: печать на контроллере дисплеев»):
#  * PPM=2 — boot.sh (makeSVS2053.py --ppm 2) отмечает терминал 2 как ЕС-7934
#    (разряд 46 в словах 027/032 вариантов ГЕНС-а);
#  * ТР7 разр.23 и 22 — печать АЦПУ0 и АЦПУ1 уходит на ЕС-7934; ПЕЧСВС читает
#    ячейку 7 при каждой выдаче, поэтому её можно взвести и после загрузки.
#    Разряды 37, 41, 45 (номер базовой секции ОС, svs.ini) остаются нулевыми;
#  * attach -p — печать дисплея 2 пишется в файл ppmprint.txt (UTF-8).
#
# Колода — gostprint.b6 (знаки ГОСТ 000-0137 через Э64).

d 7 30000000
attach -p DISPLAY2 ppmprint.txt
attach VU0 gostprint.b6
expect -r "(С|C)(М|M)1П" send "INP\r"
go
expect -r "419900000000 .*K(О|O)(Н|H)(Е|E)(Ц|C) (З|3)"
cont
step 200000000
