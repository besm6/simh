; Accumulator (floating-point) regression test.
;
; The program loops through address 2, accumulating 1.0, 2.0, 3.0, 4.0 over four
; passes.  A breakpoint at address 2 stops on BOTH instruction halves of the word,
; so the meaningful accumulator value shows up at every other stop (the one about
; to execute the left instruction).  We therefore skip the intermediate stop and
; check the accumulator at the four "left-half" stops.
;
; Expected ACC (raw 48-bit octal words, i.e. BESM-6 floating point):
;   4050 0000 0000 0000 = 1.0
;   4110 0000 0000 0000 = 2.0
;   4114 0000 0000 0000 = 3.0
;   4150 0000 0000 0000 = 4.0
;
; Note: numeric literals in `if` expressions are decimal unless written with a
; leading zero (C-style octal), so the accumulator words are written
; 04050000000000000, etc.

load pprog05.b6
br 2

go -q
if (ACC != 04050000000000000) echof "FAIL: pprog05 pass 1, expected ACC 1.0, got:"; ex -f ACC; exit 1
go -q
go -q
if (ACC != 04110000000000000) echof "FAIL: pprog05 pass 2, expected ACC 2.0, got:"; ex -f ACC; exit 1
go -q
go -q
if (ACC != 04114000000000000) echof "FAIL: pprog05 pass 3, expected ACC 3.0, got:"; ex -f ACC; exit 1
go -q
go -q
if (ACC != 04150000000000000) echof "FAIL: pprog05 pass 4, expected ACC 4.0, got:"; ex -f ACC; exit 1

echof "PASS: pprog05 (ACC = 1.0 2.0 3.0 4.0)"
