; Проверка конфигурации терминальных линий (без загрузки ОС).
; Запуск: BIN/besm6 BESM6/tests/ttyconf.ini
; Команда после строки "; ОШИБКА: ..." должна выдать сообщение об ошибке,
; остальные должны пройти молча.
;
; Без мультиплексора: линии выше 032 и "mux" недоступны, telnet не на консулы.
; ОШИБКА: линия мультиплексора, а мультиплексор не выбран
attach tty30 console
; ОШИБКА: мультиплексор не выбран
set tty5 mux
; ОШИБКА: Консул, telnet к нему не подключается
set tty lineorder=26;1-10
set tty lineorder=13;1-10
;
; ТМГУ: Консул 0 отобран.
set tty tmgu
set tty11 mux
set tty12 mux
set tty12 direct
; ОШИБКА: tty25 занят мультиплексором ТМГУ
attach tty25 console
; ОШИБКА: то же
set tty25 consul
; ОШИБКА: то же
set tty lineorder=25
; ОШИБКА: мультиплексор уже выбран
set tty dks
; ОШИБКА: мультиплексор уже выбран
set tty mux
; ОШИБКА: мультиплексор уже выбран
set dks enabled
show dks
set tty tmgu
set tty40 unicode
attach tty40 console
attach tty26 console
show tty11
show tty25
show tty40
reset
exit
