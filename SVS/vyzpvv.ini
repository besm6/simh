; Настоящая загрузка СВС: первичный загрузчик ВЫЗПВВ.
;
; В отличие от dispak.ini, АДАП сюда НЕ подкладывается: в память грузится
; только ВЫЗПВВ (02000-03777, из vyzpvv.bin через tools/bin2b6.py), а он уже
; сам читает АДАП с диска и уходит на 030000.
;
; dispak.ini остаётся как есть — это известно-рабочая конфигурация, по ней
; сверяются регрессии.

! rm -f vyzpvv.trace
set console log=vyzpvv.trace
set debug log
set cpu0 debug=dev

load vyzpvv.b6
; Системный диск — 29 МБ: номер зоны в СПУ настоящий, не удвоенный.
; ВЫЗПВВ шлёт зону 0747 (зона АДАП-а) как есть.
; Локальная копия образа с приведёнными к норме служебными словами:
; ВЫЗПВВ проверяет СС[1] строже ГЕНС-а (маска D02373, эталон D02017), а в
; исходном svs2053.bin три разряда под этой маской не те. Копию делает
; tools/makeSVS2053.py — ключ 070707 и всё вне маски сохраняются.
attach DISK1 svs2053-fixed.bin
set DISK1 29MB
attach DRUM5 drum5.bin

d RKP 1020000000000000
d NSVS 1

; Пультовые слова. ВЫЗПВВ читает 7-е (02113) и 4-е (02121);
; 2-е несёт каналы МД/МБ и маску барабанов (см. ПВВ.md §7Б.4).
d 2 1000005000000
d 7 0

; Приписка — тождественная, как в dispak.ini.
d RPS0 0003000200010000
d RPS1 0007000600050004
d RPS2 0013001200110010
d RPS3 0017001600150014
d RPS4 0023002200210020
d RPS5 0027002600250024
d RPS6 0033003200310030
d RPS7 0037003600350034
d RP0 0003000200010000
d RP1 0007000600050004
d RP2 0013001200110010
d RP3 0017001600150014
d RP4 0023002200210020
d RP5 0027002600250024
d RP6 0033003200310030
d RP7 0037003600350034

; Самоконтроль ВЫЗПВВ по этому образу не сходится (сумма 7775577677777743
; вместо всех единиц), поэтому условный переход ПО в 02404 заменён на
; безусловный ПБ — проверка обходится, дальше код идёт как есть.
;   было: к 07 012 0406, 07 26 00060  (нтж 406(7), по 60(7))
;   стало: к 07 012 0406, 07 30 00060 (нтж 406(7), пб 60(7))
d 2404 3412040637000060

go 2000

quit
