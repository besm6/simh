; Binary a.out loader regression test.
;
; Exercises besm6_load()'s automatic detection of a binary a.out image.
; aout/test1 is a linked executable whose single word at address 010 is
; "stop, utc"; a_entry = 010, so `go` starts there and the стоп (033)
; instruction halts the machine at 010.

load aout/test1
go
if (PC != 010) echof "FAIL: aout, expected PC 010, got:"; ex PC; exit 1

echof "PASS: aout"
