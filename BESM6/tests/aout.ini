; Binary a.out loader regression test (+ a TTY "hello world").
;
; Exercises besm6_load()'s automatic detection of a binary a.out image.
; aout/test1 is a linked executable (source aout/test1.s) that prints the KOI-7
; greeting "ПРИВЕТ\n" to the operator console (Consul #1) and then halts.  It
; walks the message with a vtm/vlm loop, sending each character to the console
; with `ext 0174` (opcode 033).  a_entry = 010, so `go` starts at main; the
; final стоп halts the machine at address 012.
;
; The console (tty line 25 = Consul #1) is put in UTF-8 mode and bound to the
; SIMH console so the KOI-7 codes render as UTF-8 Cyrillic on stdout.
;
; KNOWN ISSUE: b6as currently stores `.word 0160` in the high 24 bits of the
; word instead of the low bits, so `xta` loads the code into the wrong field and
; `ext 0174` sends 000 (nothing visible).  The greeting will appear once that
; assembler bug is fixed and the fixture is rebuilt; the loader regression below
; passes either way.

set tty25 unicode
attach tty25 console

load aout/test1
go
if (PC != 013) echof "FAIL: aout, expected PC 013, got:"; ex PC; exit 1

echof "PASS: aout"
