; BESM-6 regression test suite.
;
; This is the master runner.  `make besm6` discovers and runs it automatically
; (SIMH looks for <simdir>/tests/<simname>_test.ini after a successful build),
; so a broken test fails the build.  It can also be run by hand:
;
;     cd BESM6/tests && ../../BIN/besm6 besm6_test.ini
;
; Each sub-test is self-checking: on mismatch it prints a FAIL line and calls
; `exit 1`, which terminates the whole simulator with a non-zero status and
; aborts the remaining tests.  See README.md for how to add a test.

; Run from this script's own directory so the sub-tests' relative paths resolve
; no matter where the suite was invoked from.
cd %~p0

; Bound total execution so a runaway test can never hang the build.
set on
on error ignore
runlimit 300M instructions
on runtime echof "*** BESM-6 tests: runtime limit exceeded ***"; exit 1

echof BESM-6 regression tests:
do alu.ini
do pprog05.ini
do aout.ini

echof All BESM-6 tests passed.
exit 0
