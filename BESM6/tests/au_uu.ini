; Control-unit test from the BESM-6 test programs (pprog08 + drum 20),
; switch register 5 = 2: the АУ-УУ (arithmetic and control units) test.
;
; The test must run continuously.  It probes the instruction buffer (БРС) and
; the write buffer (БРЗ) as described in ТО-2 (УУ, кн. 1, 2.3 and 2.12):
; stores still waiting in БРЗ must stay invisible to instruction fetch, stores
; to the switch registers 1-7 push the oldest entry out to memory, a word is
; fetched ahead as each right instruction goes to РК, and a read may still hit
; the oldest, already written entry.  So it needs `set mmu cache`.
;
; The program first stops at 076025 waiting for the switch registers; any later
; stop within the step budget is a failure.

; Start clean: earlier tests in the suite may leave breakpoints and state.
nobreak all
reset
set mmu cache
attach -q drum1 -r drum20.bin
load pprog08.b6
d 5 2
go -q
if (PC != 076025) echof "FAIL: au_uu, expected the start-up stop at 76025, got: %TSTATUS%"; ex PC; exit 1
step -q 3000000
if "%TSTATUS%" != "Step expired" echof "FAIL: au_uu stopped:"; ex PC; exit 1
detach drum1
echof "PASS: au_uu (3M instructions without a stop)"
