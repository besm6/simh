;
; Пробы по МОТТ — модулю терминальной службы ОС.
; Подключать из sim> посреди прогона:   do probe-mott.ini
; Адреса замерены и сведены в МПД.md, раздел «Опорные адреса МОТТ».
;
; После каждой пробы прогон продолжается сам: действие заканчивается `cont`.
;

; ------ Что Диспак выдаёт в МПД и кто это вызвал.
; ВЫДАЧС вызывается через ПВ ВЫДАЧС(М17), значит М17 — адрес возврата,
; а 076157 (ячейка R) — сам слог.
break 77167;echof "--- ВЫДАЧС: слог и вызывающий";e 76157;e M17;cont

; ------ Начало приёма слога из МПД.
; 076157 здесь накапливает слог: два байта, старшим вперёд.
break 76252;echof "--- ПСЛ: приём слога";e 76157;cont

; ------ Принятый слог и куда он пошёл.
; ПАСМПД: М17 := старший байт слога, дальше `И Е8 / ПЕ СООБАС` разбирает
; разр.16. СООБАС — «СООБЩЕНИЕ ОТ АС», ответ на опрос или закрепление линии.
break 76272;echof "--- ПАСМПД: принят слог";e 76157;cont
break 76722;echof "--- СООБАС: сообщение от АС";e 76157;e M17;cont

; ------ Развилка опроса: передавать или принимать.
; break 76057;echof "--- ПРПРОЦ: есть что передать";cont
; break 76061;echof "--- ПРПРОЦ: принят байт";cont

; ------ Кто трогает рабочую ячейку слога.
; break -w 76157;e PC;cont

; ------ Покомандная трасса только по МОТТ.
; set cpu0 debug=insn
; set cpu0 window=76000:77777
