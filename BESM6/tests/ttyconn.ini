; Outgoing connection on a Consul line ("attach tty26 Line=26,Connect=host:port").
;
; tty_poll() marks Consuls without a port of their own as busy around
; tmxr_poll_conn(), so the common port never lands on one, and clears the
; mark afterwards.  A line dialling out has no port either, and when its
; connection completed in that same poll the clearing dropped it: everything
; the guest then printed was discarded.  v7besm's two-terminal test dials
; out on tty26 this way.
;
; Here tty26 dials this simulator's common port: the probe tmxr_open_master()
; makes of a Connect= destination takes one line, the real call another.
; -U: the previous run leaves the port in TIME_WAIT.  The connect banner
; reaches TTY:26's expect only if the line stays connected (tmxr_putc_ln).
;
; Connections are polled once a second of HOST time, so the bound is in
; seconds, not instructions; success stops the run as soon as it is seen.

reset
set tty26 raw8
attach -U tty1 4219
attach tty26 Line=26,Connect=127.0.0.1:4219;notelnet

dep 01000 uj 1000, uj 1000
dep PC 01000

set env TTYCONN=0
runlimit 15 seconds
expect TTY:26,"Encoding is RAW8" set env TTYCONN=1
go
noexpect TTY:26
if "%TTYCONN%" != "1" echof "FAIL: ttyconn, tty26 lost its outgoing connection"; exit 1

; besm6_test.ini's limit, which the one above replaced.
runlimit 300M instructions
detach tty26
detach tty1
echof "PASS: ttyconn"
