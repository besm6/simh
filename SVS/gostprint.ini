# gostprint.ini — консольный СКРИПТ: печать символов ГОСТ 000-0137 (э64) в
# обоих режимах АЦПУ1. Подключается из svs.ini через `do` вместо scenario.ini.
# Колода gostprint.b6 — от tools/mkgostdeck.py (там же ожидаемый текст).
#
# 1. ДАЙ Е1 — АЦПУ1 как ЕС-7036 (ПРЕДЕЛ Е24 = 1); колода через INP. Печать
#    уходит на АЦПУ0 (не подключено) -> СБО А0, ДАЙ А1 -> printer1.txt.
#    ЕС-7036 идёт ПЕРВЫМ: ПЕЧСВС грузит БУФП/БУНС, только пока РЯБУНС ≠ 0, а
#    РЯБУНС (вначале 1) после каждой операции := состояние устройства (0 у
#    симулятора) — после первой же печатной строки загрузка уже не нужна.
# 2. НЕТ Е1 — АЦПУ1 обычное (ПРЕДЕЛ Е24 = 0); та же колода ещё раз, печать
#    сразу на А1.
# Листинги: gostprint.7036.txt (после 1-го) и gostprint.all.txt (оба).

attach VU0 gostprint.b6
expect -r "(С|C)(М|M)1П" send "ДАЙ Е1\r"
go
expect -r "(Е|E)(С|C)(Т|T)Ь" send "INP\r"
cont
expect -r "(А|A)ЦП(У|Y)0" send "СБО А0\r"
cont
expect -r "(Е|E)(С|C)(Т|T)Ь" send "ДАЙ А1\r"
cont
expect -r "419900000000 +K(В|B) +(А|A)ЦП(У|Y)1"
cont
! cp printer1.txt gostprint.7036.txt
send "НЕТ Е1\r"
expect -r "(Е|E)(С|C)(Т|T)Ь"
cont
attach VU0 gostprint.b6
send "INP\r"
expect -r "419900000000 +K(В|B) +(А|A)ЦП(У|Y)1"
cont
! cp printer1.txt gostprint.all.txt
