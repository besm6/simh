#
# Гибридный прогон: АДАП с пакета 2253, диск — как у svs.ini.
#
#   python3 tools/zones2b6.py ~/.besm6/2253 30000 747 750 751 752 > adap2253.b6
#   ./boot.sh hybrid.ini
#   SVS2053=svs2253-bootfix.bin ./boot.sh hybrid.ini   # диск тоже с 2253
#
# От svs.ini отличается только модулем АДАП: вместо adap.b6 (зоны 2053)
# грузится adap2253.b6 — зоны 0747,0750,0751,0752 с ~/.besm6/2253
# (в восьмеричной нумерации между 747 и 750 нет «748/749»).
#
# Точки останова сдвинуты под раскладку 2253:
#   РЕГ '50'  33543 → 33526
#   ППВВ      32334 → 32324
#   ИНДБУД    35427 → 35400
# Вход ВЫЗОС (030036) совпадает.

! rm -f dispak.trace
set console log=dispak.trace

set cpu0 dtrace
set cpu0 panel

# В 2253 операторский терминал — линия 070 (в 2053 по умолчанию 075).
set tty70 console

# АДАП с пакета 2253 (зоны 0747–0752 → 030000…037777).
load adap2253.b6

attach DISK1 svs2053-fixed.bin
attach DRUM5 drum5.bin

d RKP 1020000000000000
d NSVS 1

d 2 1000005000000

# НАПРУС: логический номер МД. В 2053 МД = ЛУ 030-033 (ТОУ М25В'30'),
# поэтому svs.ini ставит 0030000000000200 → ЛУ 031. В 2253 МД = ЛУ 050-057
# (ТОУ М35В'05'М25В'50'М15В'10'В'120'), устройство 1 → ЛУ 051.
d 30115 0050000000000200

d RPS0 0003000200010000
d RPS1 0007000600050004
d RPS2 0013001200110010
d RPS3 0017001600150014
d RPS4 0023002200210020
d RPS5 0027002600250024
d RPS6 0033003200310030
d RPS7 0037003600350034

d RP0 0003000200010000
d RP1 0007000600050004
d RP2 0013001200110010
d RP3 0017001600150014
d RP4 0023002200210020
d RP5 0027002600250024
d RP6 0033003200310030
d RP7 0037003600350034

d 7 0

d M7 30000
br 33526
go 30036
e ACC
e rmr
nobr 33526

br 32324
step 2000000
nobr 32324

# ИНДБУД: поиск канала в БУДКАН; 32013 — запись для МД (Х'22').
br 35400
step 2000000
nobr 35400
e 30320
e 30500
e 32013

step 200000000

e 622
e 1540

quit
