; ЕС-5017 (set mg4 es) regression test.
;
; Drives the controller directly: writes an ES zone, a tape mark and a
; BESM-6 zone to a fresh tape, rewinds, and reads them back, checking the
; status (04115), error (04117) and word count (04012) registers.  Success is
; the loop at address 1177 (octal); a failure loops at 1200-1207.

reset
set mg4 es
attach -n -q mg40 esml_test.tap
load esml.b6
br 1177
br 1200
br 1201
br 1202
br 1203
br 1204
br 1205
br 1206
br 1207

go -q 1000
if (PC != 01177) echof "FAIL: esml, stopped at"; ex PC; exit 1
nobr 1177
nobr 1200
nobr 1201
nobr 1202
nobr 1203
nobr 1204
nobr 1205
nobr 1206
nobr 1207
detach mg40
set mg4 noes
delete esml_test.tap

echof "PASS: esml"
