# populate_regions.ini — §8.2.5.4: перепись служебных программ в области ARFA.*
# через СЕРП (директива ПЕРЕ, табл.7), под шифром администратора.
# «СП 4199» поднимает СЕРП задачей 419900 (после §8.2.5.3 у неё право P=З на
# области ARFA.*). Один блок ПЕРЕ = одна область; каждый ПЕРЕ формирует и тут же
# исполняет задачу переписи (Ф10N ПРОГР ПЕРЕ -> КОНЕЦ ЗАДАЧИ), после чего СЕРП
# снова спрашивает «ЧТО-». «СБОЙ АЦПУ0» после каждой переписи — печать отчёта
# на неподключённую АЦПУ0, безвредно. Приглашения — смешанная кодировка, регэкспы.
#
# Источники — служебные программы в библиотеке СЕРАРХ на томе 2113. Зона
# программы = смещение из таблицы §8.1.2 + 01700 (8-ричные):
#   СВОДКА           (2)     -> зона 1702 -> ARFA.СВОДКА (L=1)
#   БЮСТ             (3-6)   -> зона 1703 -> ARFA.БЮСТ   (L=4)
#   ARFA             (7)     -> зона 1707 -> ARFA.ГП     (L=1)
#   СТАРФА           (10-17) -> зона 1710 -> ARFA.СТАРФА (L=10)
#   библиотека ARFA  (21-24) -> зона 1721 -> ARFA.PERSO  (L=4)

expect -r "[СC][МM]1П" send "СП 4199\r"
go

# --- ПЕРЕ 1: ARFA (СЕРАРХ, зона 1707) -> ARFA.ГП (L=1) ---
expect -r "Ч(Т|T)(О|O)-" send "ПЕРЕ\r"
cont
expect -r "(С|C)ЧИ(Т|T): (Т|T)(О|O)(М|M)" send "2113\r"
cont
expect -r "З(А|A)П: (Т|T)(О|O)(М|M)" send "ARFA.ГП/999999\r"
cont
expect -r "(С|C)ЧИ(Т|T): (З)(О|O)(Н|H)(А|A)" send "1707\r"
cont
expect -r "З(А|A)П: (З)(О|O)(Н|H)(А|A)" send "0\r"
cont
expect -r "(К|K)(О|O)Л-(В|B)(О|O)" send "1\r"
cont
expect -r "(С|C)ЧИ(Т|T): (З)(О|O)(Н|H)(А|A)" send "\r"
cont

