#
# Запуск операционной системы Диспак на симуляторе СВС.
#
#   svs dispak.ini
#

# Перенаправляем вывод консоли в файл.
! rm -f dispak.trace
set console log=dispak.trace

# Включаем трассировку машинных команд (без полного дампа регистров и памяти:
# полная трассировка "set cpu0 trace" на длинном прогоне разрастается до гигабайтов).
set cpu0 itrace

# Загружаем модуль АДАП в память.
load adap.b6

# Подключаем системный диск к каналу 0, устройству 1 (DISK1).
attach DISK1 /home/leob/git/besm6.github.io/download/disks/svs2053.bin

# Конфигурация: один процессор и один ПВВ. Разряд процессора в РКП должен
# совпадать с NSVS ниже (СВС k = разряд 42-k), иначе ПОП&РКП=0 и
# межпроцессорное прерывание ПРСВС не дойдёт. Здесь СВС 1 = разр.41.
d RKP 1020000000000000

# Номер СВС работающей машины. Маска владельца в ТУСЗ (разр.7-16) для МД
# равна 01177: СВС 0 диском не владеет (АДАП уходит в ОТДАЮЗ
# "НЕДОСТУПНО ДЛЯ ОС"), СВС 1 и 2 — владеют. См. ПВВ.md §5.3.
d NSVS 1

# Задаём конфигурацию: один процессор (cpu1) и один ПВВ.
# d RKP 1020000000000000

# Слово пульта 2: номер канала для МД (разряды 22:21) и МБ (разряды 20:19).
# Без него АДАП останавливается по СТОП 40114 "НЕ ЗАДАН КАНАЛ ДЛЯ МД".
d 2 5000000

# Параметр НАПРУС: направление и номер устройства системного диска.
# 1 = канал 0, устройство 1 (соответствует attach DISK1 выше).
d 30115 0030000000000200

# Приписка страниц 12-15 (физ.адреса 30000-37777) на самих себя: код и данные
# АДАП-а (в т.ч. ТУС/ТУСЗ/ТУСМД) занимают ровно эти 4 страницы. Без этого
# STLB для них равен 0 (не настроен), и цикл ПЕРЕП (36034, копирует АДАП сам
# в себя с приpиской вкл. на чтение и выкл. на запись, VТМ 1024/1027) читает
# физ. страницу 0 вместо настоящих данных и затирает нулём уже загруженные
# ТУС/ТУСЗ/ТУСМД. РПС3 покрывает страницы 12-15 (4 упакованных по 12 разр.
# номера страниц: 14,15,16,17 восьмеричное = 12,13,14,15 десятичное).
d RPS3 0017001600150014

# Приписка стека, разряды 10:8 номеров физ.страниц.
d 7 7777000000000000
#d 7 0017000000000000

# Точка входа ВЫЗОС: вызов операционной системы.
d M7 30000
br 33543
go 30036
e ACC
e rmr
nobr 33543

br 32334
step 2000000
nobr 32334
# Точка ИНДБУД (35427): поиск канала устройства в БУДКАН по ТУСЗ[НУС].
# 32013 — запись БУДКАН для канала МД (Х'22'); разряды 1-10 = число активных
# заявок на канале (ЧАКБВВ). ВЫППВВ требует ЧАКБВВ>0, иначе ОШД12.
br 35427
step 2000000
nobr 35427
e 30320
e 30500
e 32013

step 20000000

quit
