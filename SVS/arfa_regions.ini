# arfa_regions.ini — консольный СКРИПТ настройки архива через ARFA
# (§8.2.5.2 подтверждение ключа админа + §8.2.5.3 создание служебных областей).
# Подключается из svs.ini командой `do arfa_regions.ini` ПОСЛЕ выхода ОС на
# строку смены «СМ1П». Своя колода на VU0 подключается здесь же.
#
# Первый запуск на свежем архиве (роспись 2052 сделана, админ ещё НЕ задан):
# сценарий сам задаёт администратора (СМАДМ 419900/123456), затем области.
# Консоль в смешанной кодировке — все образцы expect — регэкспы (-r) с
# альтернацией гомоглифов (В|B),(О|O),(Т|T)… (PCRE, байтовый режим).

attach VU0 arfa.b6
# INP вводит колоду ARFA (ЛЕН 42(2113)); ШИФР 4199 запускает диалоговую ARFA.
expect -r "(С|C)(М|M)1П" send "INP\r"
go
expect -r "419900000000" send "ШИФР 4199\r"
cont
# §8.2.5.2: входим админом (первый раз — БЕЗ ключа) и ЗАДАЁМ шифр/ключ админа.
expect -r "14.12.88" send "АДМИН Ш=......\r"
cont
expect -r "(А|A)Д(М|M)\." send "СМАДМ Ш=......,А=419900,К=ВЕНЕРА\r"
cont
# §8.2.5.3: бюджет общего шифра 999999, ресурс и группы (сеанс уже админский).
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "БЮДЖЕТ Ш=999999\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "РЕСУРС Ш=999999,L=62,B=Д\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ГРУППЫ Ш=999999,Г=0\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ШИФР Ш=999999\r"
cont
# Служебные области ARFA.* и права администратора (419900) на них.
expect -r "(А|A)Д(М|M)\." send "НОВ ARFA/999999:L=0\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "НОВ ARFA.ГП/999999:L=1\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ПРАВА ARFA.ГП:Ш=419900,P=З\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ПРАВА ARFA.ГП:P=Ч\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "НОВ ARFA.PERSO/999999:L=4\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ПРАВА ARFA.PERSO:Ш=419900,P=З\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ПРАВА ARFA.PERSO:P=Ч\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "НОВ ARFA.СТАРФА/999999:L=10\r"
cont
# В §8.2.5.3 для СТАРФА строки ПРАВА нет; без неё запуск «СТАРФА 4199» даёт
# «НЕСАНКЦИОН.ДОСТУП ARFA.СТАРФА». Права — как у ARFA.СВОДКА.
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ПРАВА ARFA.СТАРФА:Ш=419900,P=З\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "НОВ ARFA.СВОДКА/999999:L=1\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ПРАВА ARFA.СВОДКА:Ш=419900,P=З\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "НОВ ARFA.БЮСТ/999999:L=4\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "ПРАВА ARFA.БЮСТ:Ш=419900,P=З\r"
cont
# Завершаем сеанс ARFA (запись изменений на 2052).
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "КНЦ\r"
cont
cont
