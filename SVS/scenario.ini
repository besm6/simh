# bust.ini — консольный СКРИПТ задания БЮСТ (распределение архивного пространства).
# Подключается из svs.ini командой `do scenario.ini` (симлинк) после строки смены «СМ1П».
#
# «БЮСТ 4199» запускает задание по стандартному паспорту из системы (область
# ARFA.БЮСТ). Печать на АЦПУ0 (не подключена) -> «СБОЙ АЦПУ0»; оператор снимает А0
# (СБО А0) и отдаёт печать на АЦПУ1 (ДАЙ А1 -> printer1.txt).

expect -r "(С|C)(М|M)1П" send "БЮСТ 4199\r"
go
# БЮСТ спрашивает ключ администратора архива.
expect -r "(К|K)ЛЮЧ (А|A)Д(М|M)" send "ВЕНЕРА\r"
cont
# §8.6.3.1: «ВИД-» повторяется до пустого ответа (ДИСК/НЕРЕЗ/ЛЕНТА),
# затем «ПАР-» — тоже до пустого ответа (ВЫД/ИСП/ОСТ/РАСПР/РЕЗ).
expect -r "(В|B)ИД-" send "ДИСК\r"
cont
expect -r "(В|B)ИД-" send "\r"
cont
expect -r "П(А|A)(Р|P)-" send "ВЫД\r"
cont
expect -r "П(А|A)(Р|P)-" send "ИСП\r"
cont
expect -r "П(А|A)(Р|P)-" send "ОСТ\r"
cont
expect -r "П(А|A)(Р|P)-" send "РАСПР\r"
cont
expect -r "П(А|A)(Р|P)-" send "РЕЗ\r"
cont
expect -r "П(А|A)(Р|P)-" send "\r"
cont
expect -r "(А|A)ЦП(У|Y)0" send "СБО А0\r"
cont
expect -r "(Е|E)(С|C)(Т|T)Ь" send "ДАЙ А1\r"
cont
# Печать на АЦПУ1 закончена — останавливаем симулятор (дальше quit в svs.ini).
expect -r "419900000000 +K(В|B) +(А|A)ЦП(У|Y)1"
cont
