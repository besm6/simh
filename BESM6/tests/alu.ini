; ALU regression test.
;
; Loads a .b6 memory image that exercises the arithmetic unit and runs three
; passes, each of which must halt at address 32013 (octal).  Self-checking: any
; deviation prints a FAIL line and exits with a non-zero status.
;
; Note: numeric literals in `if` expressions are decimal unless written with a
; leading zero (C-style octal), so the octal address 32013 is written 032013.

set mmu cache
load alu.b6
br 32013

go -q 32000
if (PC != 032013) echof "FAIL: alu stop 1, expected PC 32013, got:"; ex PC; exit 1
go -q
if (PC != 032013) echof "FAIL: alu stop 2, expected PC 32013, got:"; ex PC; exit 1
go -q
if (PC != 032013) echof "FAIL: alu stop 3, expected PC 32013, got:"; ex PC; exit 1

echof "PASS: alu"
