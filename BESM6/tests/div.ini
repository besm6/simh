; Division (АД, opcode 016) regression test.
;
; div.b6 is generated by ../tools/b6div.py --gen-test: a table of dividends,
; divisors and expected quotients, computed by the bit-level model of the
; arithmetic unit (ТО ИЫ1 700 000 ТО-3, part IV, §4.16: carry-save remainder,
; table 4.4 digit selection, special rounding).  The program divides row by row
; and compares; it halts at 014 if all rows match, at 015 on the first mismatch
; (failing row = M1 + 199).
;
; The table starts with the Диспак BEMSH literals, built as successive divisions
; by 10.  Their last steps are words taken from the real machine's disk image
; 2053: Е'Е-10' = 1755574677547300 and Е'.16666666' = 3712525252434043.  The old
; simplified divider gave ...7276 and ...4042 there.

load div.b6
go -q 10
if (PC != 014) echof "FAIL: div, mismatch at row M1+199, M1 ="; ex M1; ex ACC; exit 1
if (ACC != 0) echof "FAIL: div, ACC not zero after last compare"; ex ACC; exit 1

echof "PASS: div"
