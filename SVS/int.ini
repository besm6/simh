#
# ИНТЕРАКТИВНЫЙ сеанс с Диспаком на исправленном образе системного диска.
#
#   ./isvs.sh               (соберёт образ и запустит на живом терминале)
#
# Отличия от svs.ini: журнал в int.log, точек останова и ограничений по числу
# команд нет, в конце `go`. Работа идёт с клавиатуры:
#
#   ^E            уйти в sim> прямо посреди прогона
#   cont          вернуться в машину
#   do probe-mott.ini    поставить пробы на МОТТ (см. МПД.md)
#
# Символы, набранные на терминале, приходят в машину слогом с линии 61
# (МПД.md §5); всё, что Диспак шлёт на линию 61, печатается на терминал.
#
# Отличие от dispak.ini ровно одно: подключается svs2053-fixed.bin вместо
# дистрибутивного svs2053.bin. Дистрибутивный образ несёт служебные слова
# в другом соглашении, и загрузка на нём зацикливается (см. ПВВ.md §7Б.9):
#
#   * СС[1] — ВЫЗПВВ ждёт 0007070740050000, в образе 0007070741510000;
#   * СС[0] — ДИСКИ сверяет номер зоны из служебного слова со своим КУС2
#     (ПРЗОНЫ, физ.073503) и при несовпадении уходит в ОШЗОНЫ; в образе там
#     УДВОЕННЫЙ номер, а ОС сама пишет туда неудвоенный (диски.bemsh, ОБ4А).
#
# Оба поля правит tools/makeSVS2053.py; контрольная сумма зоны
# СС[3] считается по словам данных и не затрагивается.
#
# Барабан должен быть ЧИСТЫМ: boot.sh удаляет drum5.bin перед запуском,
# иначе ОС читает свой же прошлый прогон.

# Перенаправляем вывод консоли в файл.
! rm -f int.log
set console log=int.log
# Кольцевой буфер в памяти на 64 МБ: хранится ПОСЛЕДНЕЕ окно трассы (~1 млн
# команд при ~47 байт на команду) и выгружается в файл на выходе в `sim>` —
# то есть на останове. Отдельный файл обязателен: при `set debug log`
# буферизация обходится стороной (`_sim_debug_flush`, scp.c).
! rm -f win.trace
set debug -b 64 win.trace

# Включаем трассировку машинных команд (без полного дампа регистров и памяти:
# полная трассировка "set cpu0 debug" на длинном прогоне разрастается до гигабайтов).
set cpu0 debug=dev

set cpu0 idle
set cpu0 autotime=5

# Покомандная трасса включается уже из sim>, вместе с окном по адресам:
#   set cpu0 debug           все разряды: команды, регистры, память
#   set cpu0 window=76000:77777
# Разряд regs обязателен, иначе изменённые регистры не печатаются:
#   set cpu0 debug=insn      только команды, без регистров
#   set cpu0 debug=insn;regs команды и регистры
set cpu0 panel

# Загружаем модуль АДАП в память (по 030000, как и записано в самом adap.b6:
# приписка тождественная, так что физический адрес совпадает с виртуальным).
load adap.b6

# Подключаем системный диск к каналу 0, устройству 1 (DISK1).
attach DISK1 svs2053-fixed.bin

attach DISK2 svs2048-fixed.bin

# Магнитные барабаны (МБ, класс 4 в ТУС — блок ТУСМБ@030460, МБ 00-07).
# Барабаны ЧИСТЫЕ: образ заранее не нужен, файл создаётся пустым, незаписанные
# зоны читаются нулями. Загрузка обращается к барабану 5 (НУС=69 = 64+5).
attach DRUM5 drum5.bin

# Конфигурация: один процессор и один ПВВ. Разряд процессора в РКП должен
# совпадать с NSVS ниже (СВС k = разряд 42-k), иначе ПОП&РКП=0 и
# межпроцессорное прерывание ПРСВС не дойдёт. Здесь СВС 1 = разр.41.
d RKP 1020000000000000

# Номер СВС работающей машины. Маска владельца в ТУСЗ (разр.7-16) для МД
# равна 01177: СВС 0 диском не владеет (АДАП уходит в ОТДАЮЗ
# "НЕДОСТУПНО ДЛЯ ОС"), СВС 1 и 2 — владеют. См. ПВВ.md §5.3.
d NSVS 1

# Задаём конфигурацию: один процессор (cpu1) и один ПВВ.
# d RKP 1020000000000000

# Слово пульта 2:
#  - разряды 22:21 — номер канала для МД, 20:19 — для МБ (без них АДАП
#    останавливается по СТОП 40114 / 40113 "НЕ ЗАДАН КАНАЛ");
#  - СТАРШИЕ 12 разрядов (37-48) — разрешённые магнитные барабаны, хотя бы один.
#    Вызывалка проверяет их так (02104): СЧ 2; СДА 72 (сдвиг влево на 6);
#    И 2603 (маска 07777000000000000 — те самые старшие 12 разрядов);
#    ПО 2013 -> СТОП 205. После сдвига в маску попадают разряды 37-42 слова 2,
#    поэтому включаем разряд 37 (2^36) — один барабан.
d 2 1000005000000

# Параметр НАПРУС: направление и номер устройства системного диска.
# 1 = канал 0, устройство 1 (соответствует attach DISK1 выше).
d 30115 0030000000000200

# Тождественная приписка: вирт. страница N -> физ. страница N, все 32 страницы,
# и для ЯДРА (РПС), и для ПОЛЬЗОВАТЕЛЯ (РП).
#
# Ноль выбран не произвольно: АДАП сам перепрограммирует РП0 значением из
# таблицы СЕКЦИИ (030163) по номеру ПЕРВОЙ ОТКРЫТОЙ СЕКЦИИ, а нулевая её
# запись (0000000000304040) задаёт как раз страницы 0,1,2,3. Значит при
# тождественной приписке РЕГ '60' не сдвигает страницу 0, и стек, лежащий
# по вирт.01540, остаётся на месте (см. дамп приписки в mmu_set_rp).
# Каждый регистр упаковывает 4 номера страниц по 12 разрядов (сдвиги
# 0/12/24/36 -> страницы 4i+0..4i+3, см. mmu_setup).
d RPS0 0003000200010000
d RPS1 0007000600050004
d RPS2 0013001200110010
d RPS3 0017001600150014
d RPS4 0023002200210020
d RPS5 0027002600250024
d RPS6 0033003200310030
d RPS7 0037003600350034

d RP0 0003000200010000
d RP1 0007000600050004
d RP2 0013001200110010
d RP3 0017001600150014
d RP4 0023002200210020
d RP5 0027002600250024
d RP6 0033003200310030
d RP7 0037003600350034

# Слово пульта 7: НОМЕР БАЗОВОЙ СЕКЦИИ ОС — разряды 37, 41, 45 (три бита).
# ПРОЦЕД (032171) собирает их маской КВСЕК (=М36Х'888') и кладёт номер секции
# в СЕКОС[НСВС]; оттуда ДАЙПРС (033444) берёт его индексом в таблицу СЕКЦИИ
# (030163), а РЕГ '60' (033565) программирует этим значением РП0 — приписку
# виртуальных страниц 0-3, в которых лежит СТЕК (вирт.01540).
#
# Секция 0: СЕКЦИИ[0] = 0000000000304040 -> страницы 0,1,2,3, то есть
# тождественно. Только при ней РЕГ '60' не сдвигает страницу 0 и адрес
# возврата, положенный в стек до перенастройки, читается оттуда же.
# Прежнее 7777... задавало секцию 7 -> страницы 1600-1603, и стек уезжал.
d 7 0

# Точка входа ВЫЗОС: вызов операционной системы.
d M7 30000

# Erase catalogs
d 3 0000000077700000

go 30036
