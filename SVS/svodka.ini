# svodka.ini — консольный СКРИПТ задания СВОДКА (сводка тома архива).
# Подключается из svs.ini командой `do svodka.ini` ПОСЛЕ выхода ОС на строку смены «СМ1П».
#
# «СВОДКА 4199» запускает задание по стандартному паспорту из системы;
# печать идёт на АЦПУ0 (не подключена) -> «СБОЙ АЦПУ0». Оператор снимает А0
# (СБО А0) и отдаёт печать на АЦПУ1 (ДАЙ А1 -> printer1.txt). Образцы expect —
# регэкспы (-r) с альтернацией гомоглифов.

expect -r "[СC][МM]1П" send "СВОДКА 4199\r"
go
expect -r "(А|A)ЦП(У|Y)0" send "СБО А0\r"
cont
expect -r "(Е|E)(С|C)(Т|T)Ь" send "ДАЙ А1\r"
cont
# Печать на АЦПУ1 закончена — останавливаем симулятор (дальше quit в svs.ini).
expect -r "419900000000 +K(В|B) +(А|A)ЦП(У|Y)1"
cont
