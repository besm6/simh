# starfa_rights.ini — консольный СКРИПТ: выдать права на уже созданную область
# ARFA.СТАРФА (в §8.2.5.3 строки ПРАВА для неё нет, запуск «СТАРФА 4199» даёт
# «НЕСАНКЦИОН.ДОСТУП ARFA.СТАРФА»). Права — как у ARFA.СВОДКА.
# Подключается из svs.ini командой `do scenario.ini` (симлинк) после строки смены «СМ1П».
# Админ уже задан (шифр 419900, ключ ВЕНЕРА) — входим с ключом.

attach VU0 arfa.b6
expect -r "[СC][МM]1П" send "INP\r"
go
expect -r "419900000000" send "ШИФР 4199\r"
cont
expect -r "14.12.88" send "АДМИН Ш=......,К=ВЕНЕРА\r"
cont
# Ответ на АДМИН — «419900  АДМ.......»; точка обязательна, иначе образец
# совпадёт с эхом самой команды «АДМИН».
# Область принадлежит бюджету 999999 — переходим на этот шифр, иначе ПРАВА
# отвечает «НЕТ ПОЛНОМОЧИЙ».
expect -r "419900 +(А|A)Д(М|M)\." send "ШИФР Ш=999999\r"
cont
expect -r "999999 +(А|A)Д(М|M)" send "ПРАВА ARFA.СТАРФА:Ш=419900,P=З\r"
cont
expect -r "(В|B)ЫП(О|O)Л(Н|H)" send "КНЦ\r"
cont
# Сеанс ARFA закрыт — останавливаем симулятор (дальше quit в svs.ini).
expect -r "(К|K)(О|O)(Н|H)(Е|E)Ц (С|C)(Е|E)(А|A)(Н|H)(С|C)(А|A)"
cont
