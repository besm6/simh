# populate_starfa_perso.ini — §8.2.5.4 для двух областей, не заполненных при
# первом прогоне populate_regions.ini: СТАРФА и библиотека ARFA (PERSO).
# Зона программы = смещение из таблицы §8.1.2 + 01700 (8-ричные):
#   СТАРФА           (10-17) -> зона 1710 -> ARFA.СТАРФА (L=10)
#   библиотека ARFA  (21-24) -> зона 1721 -> ARFA.PERSO  (L=4)
# «СП 4199» поднимает СЕРП задачей 419900; после КНЦ симулятор останавливается.

expect -r "[СC][МM]1П" send "СП 4199\r"
go

# --- ПЕРЕ 1: СТАРФА (зона 1710) -> ARFA.СТАРФА (L=10) ---
expect -r "Ч(Т|T)(О|O)-" send "ПЕРЕ\r"
cont
expect -r "(С|C)ЧИ(Т|T): (Т|T)(О|O)(М|M)" send "2113\r"
cont
expect -r "З(А|A)П: (Т|T)(О|O)(М|M)" send "ARFA.СТАРФА/999999\r"
cont
expect -r "(С|C)ЧИ(Т|T): (З)(О|O)(Н|H)(А|A)" send "1710\r"
cont
expect -r "З(А|A)П: (З)(О|O)(Н|H)(А|A)" send "0\r"
cont
expect -r "(К|K)(О|O)Л-(В|B)(О|O)" send "10\r"
cont
expect -r "(С|C)ЧИ(Т|T): (З)(О|O)(Н|H)(А|A)" send "\r"
cont

# --- ПЕРЕ 2: библиотека ARFA (зона 1721) -> ARFA.PERSO (L=4) ---
expect -r "Ч(Т|T)(О|O)-" send "ПЕРЕ\r"
cont
expect -r "(С|C)ЧИ(Т|T): (Т|T)(О|O)(М|M)" send "2113\r"
cont
expect -r "З(А|A)П: (Т|T)(О|O)(М|M)" send "ARFA.PERSO/999999\r"
cont
expect -r "(С|C)ЧИ(Т|T): (З)(О|O)(Н|H)(А|A)" send "1721\r"
cont
expect -r "З(А|A)П: (З)(О|O)(Н|H)(А|A)" send "0\r"
cont
expect -r "(К|K)(О|O)Л-(В|B)(О|O)" send "4\r"
cont
expect -r "(С|C)ЧИ(Т|T): (З)(О|O)(Н|H)(А|A)" send "\r"
cont

expect -r "Ч(Т|T)(О|O)-" send "КНЦ\r"
cont
# Сеанс СЕРП закрыт — останавливаем симулятор (дальше quit в svs.ini).
expect -r "(К|K)(О|O)(Н|H)(Е|E)Ц (С|C)(Е|E)(А|A)(Н|H)(С|C)(А|A)"
cont
